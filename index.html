<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Storefront Redesign - Software Bundles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Mobile Screen Container (Simulates phone screen on desktop, full-width on mobile) -->
  <div class="mobile-container">

    <!-- 1. Header & Navigation -->
    <header class="site-header">
      <!-- Humble Bundle Logo -->
      <a href="#" class="logo-link" aria-label="Humble Bundle Home">
        <img src="images/logo.png" alt="Humble Bundle" class="site-logo">
      </a>

      <!-- Navigation Circles & More Chevron -->
      <nav class="nav-icons" aria-label="Navigation categories">
        <button type="button" class="circle-icon" aria-label="Category 1"></button>
        <button type="button" class="circle-icon" aria-label="Category 2"></button>
        <button type="button" class="circle-icon" aria-label="Category 3"></button>

        <!-- More Chevron (Easy to swap) -->
        <span class="nav-chevron" aria-hidden="true">
          <svg class="ui-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </nav>

      <!-- Header Action Buttons (Search & Profile) -->
      <div class="header-actions">
        <!-- Search Button (Easy to swap) -->
        <button type="button" class="action-btn search-btn" aria-label="Search">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>

        <!-- Profile Button (Easy to swap) -->
        <button type="button" class="action-btn profile-btn" aria-label="User profile">
          <svg class="ui-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">

      <!-- 2. Title & Intro Section -->
      <section class="intro-section">
        <div class="intro-header">
          <div class="intro-text">
            <h1 class="page-title">SOFTWARE BUNDLES</h1>
            <!-- Placeholder copy for introductory text -->
            <p class="intro-description">
              Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod 
              tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, 
              quis nostrud exercitation ullamco laboris.
            </p>
          </div>

          <!-- Humble Pig Mascot Graphic -->
          <div class="intro-mascot" aria-label="Humble Pig mascot">
            <img src="images/pig.png" alt="Humble Bundle Mascot Pig" class="intro-pig-img">
          </div>
        </div>

        <!-- Bundles Filter Button -->
        <div class="filter-container">
          <button type="button" class="filter-btn">
            <span class="filter-label">Bundles</span>

            <!-- Filter Funnel Icon (Easy to swap) -->
            <svg class="ui-icon filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>

            <!-- Dropdown Chevron Icon (Easy to swap) -->
            <svg class="ui-icon dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </section>

      <!-- 3. Featured Content Display Area (Carousel) -->
      <section class="featured-section" aria-label="Featured Content">
        <div class="carousel-container">
          <!-- Previous Card Arrow (Easy to swap) -->
          <button type="button" class="carousel-arrow prev-arrow" aria-label="Previous item">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <!-- Carousel Track Holding Cards -->
          <div class="carousel-track">
            <!-- Left Peeking Card -->
            <div class="featured-card card-peek card-prev">
              <div class="card-media wireframe-cross"></div>
              <div class="card-footer">
                <div class="card-btn-placeholder small"></div>
              </div>
            </div>

            <!-- Active Center Card -->
            <div class="featured-card card-active">
              <!-- Card Media with wireframe X and circular badge -->
              <div class="card-media wireframe-cross">
                <div class="card-badge" aria-label="Badge placeholder">
                  <span class="cross-line cross-1"></span>
                  <span class="cross-line cross-2"></span>
                </div>
              </div>
              <!-- Card Footer with text lines and action button -->
              <div class="card-footer">
                <div class="card-info-lines">
                  <div class="card-line card-line-title"></div>
                  <div class="card-line card-line-body"></div>
                </div>
                <div class="card-btn-placeholder"></div>
              </div>
            </div>

            <!-- Right Peeking Card -->
            <div class="featured-card card-peek card-next">
              <div class="card-media wireframe-cross">
                <div class="card-badge" aria-label="Badge placeholder">
                  <span class="cross-line cross-1"></span>
                  <span class="cross-line cross-2"></span>
                </div>
              </div>
              <div class="card-footer">
                <div class="card-info-lines">
                  <div class="card-line card-line-body"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Next Card Arrow (Easy to swap) -->
          <button type="button" class="carousel-arrow next-arrow" aria-label="Next item">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </section>

      <!-- 4. About Our Bundles Section -->
      <section class="about-section">
        <h2 class="section-title">ABOUT OUR BUNDLES</h2>

        <!-- Info Cards Row -->
        <div class="about-cards-container">
          <!-- Info Card 1 -->
          <article class="about-card">
            <div class="card-line card-line-title"></div>
            <div class="card-line card-line-body"></div>
            <div class="card-line card-line-body short"></div>
          </article>

          <!-- Info Card 2 -->
          <article class="about-card">
            <div class="card-line card-line-title"></div>
            <div class="card-line card-line-body"></div>
            <div class="card-line card-line-body short"></div>
          </article>

          <!-- Info Card 3 -->
          <article class="about-card">
            <div class="card-line card-line-title"></div>
            <div class="card-line card-line-body"></div>
            <div class="card-line card-line-body short"></div>
          </article>
        </div>
      </section>

    </main>

  </div>

</body>
</html>
